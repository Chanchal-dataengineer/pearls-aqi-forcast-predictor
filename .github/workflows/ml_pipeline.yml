name: AQI ML Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

jobs:
  validate-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python environment
        run: |
          python -c "import pandas, numpy, sklearn, joblib, shap, flask, streamlit; print('All required packages imported successfully')"

      - name: Validate project artifacts
        run: |
          test -f models/aqi_model.pkl
          test -f models/feature_columns.pkl
          test -f models/model_metadata.json
          test -f data/processed/AQI_feature_engineered.csv
          echo "Required project artifacts found"

      - name: Validate model schema
        run: |
          python - <<'PY'
          import joblib

          columns = joblib.load("models/feature_columns.pkl")

          expected = [
              "CO", "NO", "NO2", "O3", "SO2",
              "PM2_5", "PM10", "NH3",
              "hour", "day", "month", "weekday",
              "AQI", "AQI_lag_1", "AQI_change",
              "AQI_rolling_avg"
          ]

          assert list(columns) == expected, (
              f"Feature schema mismatch.\n"
              f"Expected: {expected}\n"
              f"Found: {list(columns)}"
          )

          assert len(columns) == 16

          print("Feature schema validation passed")
          print("Feature count:", len(columns))
          PY

      - name: Validate model loading
        run: |
          python - <<'PY'
          import joblib

          model = joblib.load("models/aqi_model.pkl")

          print("Model loaded successfully")
          print("Model type:", type(model).__name__)
          PY