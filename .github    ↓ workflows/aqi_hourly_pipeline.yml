name: AQI Hourly Feature Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: aqi-hourly-pipeline
  cancel-in-progress: false

jobs:
  hourly-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate OpenWeather secret
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          if [ -z "$OPENWEATHER_API_KEY" ]; then
            echo "ERROR: OPENWEATHER_API_KEY GitHub Actions secret is missing."
            exit 1
          fi

          echo "OpenWeather secret is configured."

      - name: Run automated feature pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          set -e

          echo "Starting AQI feature pipeline..."

          for attempt in 1 2 3; do
            echo "Pipeline attempt: $attempt"

            if python scripts/automated_feature_pipeline.py; then
              echo "Feature pipeline completed successfully."
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Feature pipeline failed after 3 attempts."
              exit 1
            fi

            echo "Pipeline failed. Waiting 20 seconds before retry..."
            sleep 20
          done

      - name: Run data quality monitoring
        run: |
          python scripts/monitor_data.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit updated AQI data
        run: |
          git add data/raw data/processed

          if git diff --cached --quiet; then
            echo "No new AQI data changes to commit."
          else
            git commit -m "Automated AQI data update [skip ci]"
          fi

      - name: Sync with remote
        run: |
          git pull --rebase origin main

      - name: Push updated AQI data
        run: |
          for attempt in 1 2 3; do
            echo "Push attempt: $attempt"

            if git push origin HEAD:main; then
              echo "AQI data pushed successfully."
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: Git push failed after 3 attempts."
              exit 1
            fi

            echo "Push failed. Waiting 15 seconds..."
            sleep 15
            git pull --rebase origin main
          done